apiVersion: v1
kind: Service
metadata:
  name: {{ include "ladderframe.fullname" . }}
  labels: {{- include "ladderframe.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ladderframe.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    {{- if .Values.temporalMetricsPort }}
    - {name: temporal-metrics, port: {{ .Values.temporalMetricsPort }}, targetPort: temporal-metrics}
    {{- end }}
