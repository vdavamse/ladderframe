[project]
name = "ladderframe"
version = "0.1.0"
description = "A configurable, file-driven agent harness built on pydantic-ai."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic,openai,mcp,web-fetch]>=2.51.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
search = ["pydantic-ai-slim[duckduckgo]>=2.51.0"]
tavily = ["pydantic-ai-slim[tavily]>=2.51.0"]
server = ["fastapi>=0.115", "uvicorn>=0.34", "pydantic-ai-slim[ui,ag-ui,web]>=2.51.0"]
temporal = ["pydantic-ai-slim[temporal]>=2.51.0", "temporalio[aioboto3]>=1.33.0"]
harness-capabilities = ["pydantic-ai-harness[prompt-injection-defender]>=0.36.0"]
all = ["ladderframe[search,server,temporal,harness-capabilities]"]

[project.scripts]
ladderframe = "ladderframe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ladderframe"]
