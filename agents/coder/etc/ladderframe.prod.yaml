# Production overlay: LADDERFRAME_PROFILE=prod

permissions:
  default: deny
  allow:
    - Read
    - Glob
    - Grep
    - Skill
    - Agent
    - WebSearch
    - WebFetch
    - Bash(git *)
    - Bash(gh issue view *)

capabilities:
  - prompt_injection_defender: {block_high_risk: true}

runtime:
  executor: temporal
  temporal:
    address: ${TEMPORAL_ADDRESS:-temporal:7233}
    namespace: ${TEMPORAL_NAMESPACE:-ladderframe}
    session_idle_timeout: 7d

storage:
  endpoint: ${S3_ENDPOINT:-http://minio:9000}
  bucket: ${S3_BUCKET:-ladderframe}
  access_key: ${S3_ACCESS_KEY}
  secret_key: ${S3_SECRET_KEY}

server:
  host: 0.0.0.0
  port: 8080
  protocols: [vercel-ai]
  auth: api-key
  api_keys: ["${LADDERFRAME_API_KEY}"]
