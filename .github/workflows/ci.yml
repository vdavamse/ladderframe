name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright packages/harness/src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # Includes end-to-end tests against a local Temporal dev server (downloaded by the Temporal SDK)
      # and an S3 API (moto).
      - run: uv run pytest -q

  check-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: ladderframe check (every agent, every profile)
        env:
          LADDERFRAME_API_KEY: ci-placeholder
          S3_ACCESS_KEY: ci-placeholder
          S3_SECRET_KEY: ci-placeholder
        run: |
          set -e
          for root in agents/*/; do
            echo "::group::check $root"
            uv run ladderframe --root "$root" check
            for overlay in "$root"etc/ladderframe.*.yaml; do
              [ -e "$overlay" ] || continue
              profile=$(basename "$overlay" .yaml); profile=${profile#ladderframe.}
              uv run ladderframe --root "$root" --profile "$profile" check
            done
            echo "::endgroup::"
          done

  evals:
    # Runs the pydantic-evals datasets in agents/*/evals against the real model.
    # Needs the ANTHROPIC_API_KEY repository secret; skipped (not failed) without it.
    runs-on: ubuntu-latest
    needs: [test]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: ladderframe eval
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set; skipping evals"
            exit 0
          fi
          set -e
          for root in agents/*/; do
            [ -d "${root}evals" ] || continue
            echo "::group::eval $root"
            uv run ladderframe --root "$root" eval --min-pass-rate "${EVAL_MIN_PASS_RATE:-0.8}"
            echo "::endgroup::"
          done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/ladderframe
      - run: helm template coder deploy/helm/ladderframe -f deploy/helm/ladderframe/ci-values.yaml > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: AGENT=coder
          push: false
          tags: ladderframe-coder:ci
